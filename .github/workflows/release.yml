# Publishes the patched packages to the `dist` branch, a `v<major>.<minor>.<patch>` tag and a
# GitHub Release after a change reaches master. master itself is never written.

name: release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The write token must not be readable by upstream code run in the smoke test.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and smoke test
        run: pnpm smoke

      - name: Publish dist
        # Authenticate git here only (same header actions/checkout would persist).
        run: |
          credential="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$credential"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $credential"
          pnpm release
        env:
          GH_TOKEN: ${{ github.token }}
